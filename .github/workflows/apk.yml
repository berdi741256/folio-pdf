name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copiar la app web dentro del APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html manifest.webmanifest lib fonts icons android/app/src/main/assets/www/

      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }} --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk FolioPDF.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Folio PDF 1.${{ github.run_number }}
          body: Descarga **FolioPDF.apk** e instálalo en tu Android.
          files: FolioPDF.apk
          make_latest: true
