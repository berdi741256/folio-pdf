plugins {
    id 'com.android.application'
}

def vCode = Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())
def vName = (project.findProperty('versionName') ?: '1.0').toString()

android {
    namespace 'pe.berdi.foliopdf'
    compileSdk 34

    defaultConfig {
        applicationId 'pe.berdi.foliopdf'
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        release {
            storeFile file('../folio-release.p12')
            storeType 'pkcs12'
            storePassword 'foliopdf'
            keyAlias 'folio'
            keyPassword 'foliopdf'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
